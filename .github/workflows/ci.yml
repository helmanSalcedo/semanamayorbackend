name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy secrets: this is a CI database that lives only for the run, never
  # a real deployment. Real secrets live in the deploy environment, not here.
  DATABASE_URL: postgresql://timbio:timbio@localhost:5432/timbio_ci?schema=public
  TEST_DATABASE_URL: postgresql://timbio:timbio@localhost:5432/timbio_ci_test?schema=public
  JWT_ACCESS_SECRET: ci-only-access-secret-not-a-real-secret-000000
  JWT_REFRESH_SECRET: ci-only-refresh-secret-not-a-real-secret-00000

jobs:
  lint-and-build:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm test

      - run: pnpm run build

  integration-and-e2e:
    name: Integration & e2e tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: timbio
          POSTGRES_PASSWORD: timbio
          POSTGRES_DB: timbio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The db:*/test:integration/test:e2e scripts load env vars via
      # `dotenv -e .env`, so CI needs a real .env file, not just job env vars.
      - name: Write CI .env
        run: |
          cat > .env <<EOF
          NODE_ENV=test
          PORT=3000
          API_PREFIX=api
          DATABASE_URL=${{ env.DATABASE_URL }}
          TEST_DATABASE_URL=${{ env.TEST_DATABASE_URL }}
          LOG_LEVEL=warn
          JWT_ACCESS_SECRET=${{ env.JWT_ACCESS_SECRET }}
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_REFRESH_SECRET=${{ env.JWT_REFRESH_SECRET }}
          JWT_REFRESH_EXPIRES_IN=7d
          THROTTLE_TTL_MS=60000
          THROTTLE_LIMIT=1000
          CORS_ORIGINS=
          APP_URL=http://localhost:3000
          EMAIL_VERIFICATION_EXPIRES_IN=24h
          PASSWORD_RESET_EXPIRES_IN=1h
          SMTP_HOST=
          MAIL_FROM=CI <no-reply@timbio.local>
          TOKEN_CLEANUP_RETENTION_DAYS=30
          EOF

      - run: npx prisma generate

      - run: pnpm run test:integration

      - run: pnpm run test:e2e
