name: Reporte de bug
description: Algo no funciona como debería
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: ¿Qué pasó?
      description: Descripción clara del problema
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Logs, screenshots, versión de Node/pnpm, endpoint afectado, etc.
    validations:
      required: false
